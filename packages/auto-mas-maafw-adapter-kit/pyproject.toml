[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-maafw-adapter-kit"
version = "0.3.1"
description = "MFW 三个专项共用的代码：属主入口、密码字段加密、默认任务队列、配置恢复池"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
# 是库，不是插件：不带 auto-mas-plugin 关键词，不进插件市场
dependencies = [
    "auto-mas-core>=5.9.0b1,<6",
    "auto-mas-maafw-interface>=0.3.0,<0.4",
    "auto-mas-maafw-native>=0.3.0,<0.4",
]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/blob/main/packages/auto-mas-maafw-adapter-kit/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/blob/main/packages/auto-mas-maafw-adapter-kit/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maafw_adapter_kit = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["maafw_adapter_kit"]
known-third-party = ["app", "auto_mas_core", "maafw_interface", "maafw_native"]
