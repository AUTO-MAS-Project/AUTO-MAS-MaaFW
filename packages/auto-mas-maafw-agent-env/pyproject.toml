[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-maafw-agent-env"
version = "0.3.1"
description = "准备 MFW 项目 agent 的 Python 环境与运行池"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:maafw_agent_env"]
dependencies = [
    "auto-mas-core>=5.9.0b1,<6",
    "auto-mas-maafw-interface>=0.3.0,<0.4",
    "auto-mas-maafw-native>=0.3.0,<0.4",
]

[project.urls]
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/blob/main/packages/auto-mas-maafw-agent-env/README.md"
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/blob/main/packages/auto-mas-maafw-agent-env/CHANGELOG.md"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maafw_agent_env = ["py.typed"]
"maafw_agent_env.core.agent_env" = ["py.typed"]
"maafw_agent_env.core.runtime_pool" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["maafw_agent_env"]
known-third-party = ["app", "auto_mas_core", "maafw_interface", "maafw_native"]
