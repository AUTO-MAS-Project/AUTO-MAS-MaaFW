[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-maafw-runner"
version = "0.3.0"
description = "MFW runner block for AUTO-MAS: worker, timeouts, loop guard, failure screenshots and log redaction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:maafw_runner"]
# worker 直接导入两块库，按次版本写上限；agent 环境只写下限（worker 经 maafw_agent_env.core.worker_api 门面导入，门面带 worker_api 版本）。
# 三方依赖（pydantic、psutil、numpy、maafw 等）由宿主提供，不在这里声明。
dependencies = [
    "auto-mas-core>=5.9.0b1,<6",
    "auto-mas-maafw-interface>=0.3.0,<0.4",
    "auto-mas-maafw-native>=0.3.0,<0.4",
    "auto-mas-maafw-agent-env>=0.3.0",
]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/blob/main/packages/auto-mas-maafw-runner/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/blob/main/packages/auto-mas-maafw-runner/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-MaaFW/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maafw_runner = ["py.typed"]
"maafw_runner.core.runner" = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["maafw_runner"]
known-third-party = ["app", "auto_mas_core", "maafw_interface", "maafw_native", "maafw_agent_env"]
