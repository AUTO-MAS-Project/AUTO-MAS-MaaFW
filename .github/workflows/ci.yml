name: 构建与校验

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 六个包全部构建并校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 安装构建工具
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: 构建 wheel 和源码包
        run: python scripts/build_all.py
      - name: 校验包元数据
        run: python -m twine check --strict dist/*
      - name: wheel 里不带测试
        # 两块库的 sdist 按惯例带着它们已提交的测试，只查 wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          for path in Path("dist").glob("*.whl"):
              names = ZipFile(path).namelist()
              bad = [n for n in names if n.startswith("tests/") or "/tests/" in n]
              if bad:
                  raise SystemExit(f"{path.name} 带了测试文件：{bad[:5]}")
          PY
      - name: 不碰宿主的部分能单独导入
        # 插件类与 host/ 下的模块要 SDK，SDK 自己要宿主，这里只查两块库、worker 侧的 core/
        # 和专项共用库（它把 SDK 与项目更新都放在函数体内取）
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install --no-deps dist/*.whl
          # 与运行池 venv 一致（BASE_RUNTIME_PACKAGES）再加 maafw：worker 侧 core/ 要用到
          .smoke/bin/python -m pip install "pydantic==2.11.7" "json5==0.14.0" json-with-comments \
            psutil packaging numpy strenum maaagentbinary "maafw==5.16.1"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_import.py" \
            maafw_interface maafw_native maafw_agent_env.core maafw_runner.core maafw_adapter_kit
      # 两块库的单元测试要用真实的 MaaFramework 项目当夹具，CI 上没有，只在本地跑。
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
